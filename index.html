        const tex = cmds[i + 1], first = cmds[i + 2], count = cmds[i + 3];
        let t = null;
        if (tex === -1) t = whiteTex;
        else if (tex === -2) t = appTex;
        else { const pg = pages[tex]; if (pg) t = pg.tex; }
        if (t) {
          gl.bindTexture(gl.TEXTURE_2D, t);
          if (tex === -2) gl.uniform1f(uFlip, 1);
          gl.drawArrays(gl.TRIANGLES, first, count);
          if (tex === -2) gl.uniform1f(uFlip, 0);
        }
        i += 4;
      } else if (c === 5) { // blit app surface
        gl.bindVertexArray(blitVao);
        gl.bindTexture(gl.TEXTURE_2D, appTex);
        gl.uniform1f(uFlip, 1);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.uniform1f(uFlip, 0);
        gl.bindVertexArray(vao);
        i += 1;
      } else {
        console.error('bad render command', c);
        break;
      }
    }
  }

  // ------------------------------------------------------------------ main loop
  let acc = 0, last = 0, waitUntil = 0, running = false;
  function stepOnce() {
    const r = W.gm_frame();
    frameNo++;
    if (r === 2) { gameEnded = true; }
    return r;
  }
  function loop(ts) {
    if (!running) return;
    requestAnimationFrame(loop);
    if (gameEnded) { showEnd(); running = false; return; }
    if (!last) last = ts;
    let dt = ts - last;
    last = ts;
    if (dt > 250) dt = 250;
    if (loading.size > 0 && performance.now() < waitUntil) return; // hold while a room's textures load
    const spd = W.gm_room_speed() || 30;
    const fdt = 1000 / spd;
    acc += dt;
    let n = 0, drew = false;
    while (acc >= fdt - 0.5 && n < 4) {
      acc -= fdt;
      n++;
      const r = stepOnce();
      drew = true;
      if (r === 1) { waitUntil = performance.now() + 3000; acc = 0; break; }
      if (r === 2) break;
    }
    if (acc > fdt * 4) acc = 0;
    if (drew) render();
    maybeUnlock();
  }
  document.addEventListener('visibilitychange', () => {
    if (!running) return;
    if (document.hidden) {
      actx.suspend();
      for (const i of insts.values()) if (i.el && !i.el.paused) { i.el.pause(); i.hiddenPause = true; }
    } else {
      actx.resume();
      for (const i of insts.values()) if (i.hiddenPause) { i.hiddenPause = false; if (!i.paused) i.el.play().catch(() => {}); }
      last = 0; acc = 0;
    }
  });
  function showEnd() {
    overlay.style.display = 'flex';
    setStatus('The game has ended.');
    const b = $('gm-start');
    b.textContent = 'PLAY AGAIN';
    b.style.display = 'inline-block';
    b.onclick = () => location.reload();
  }

  async function boot() {
    setStatus('Loading engine...');
    const wasmBytes = await gunzip(await bytesOf('gm-wasm'));
    const { instance } = await WebAssembly.instantiate(wasmBytes, imports);
    W = instance.exports;
    mem = W.memory;
    setStatus('Loading game data...');
    const json = await gunzip(await bytesOf('gm-data'));
    const p = W.gm_alloc(json.length);
    new Uint8Array(mem.buffer, p, json.length).set(json);
    if (!W.gm_init(json.length)) throw new Error('game data failed to load: ' + errors.join('\n'));
    // preload the first room's pages and the cursor/text pages
    const first = META.preload || [];
    setStatus('Loading textures...');
    await Promise.all(first.map((p) => requestPage(p)));
    setStatus('');
    if (!EMBEDDED) {
      // folder build: check the sound folder is reachable, offer to rebuild the single-file version
      let smallest = 0;
      META.sounds.forEach((sm, k) => { if (sm.dur < META.sounds[smallest].dur) smallest = k; });
      try { await b64Of('gm-snd-' + smallest); }
      catch (e) {
        $('gm-warn').textContent = 'Sound files not found. Put the "' + SND_DIR + '" folder next to this game\'s folder (both folders side by side), then reload. The game will run silently otherwise.';
      }
      const sv = $('gm-save');
      sv.style.display = 'inline-block';
      sv.onclick = () => saveSingle(sv);
    }
    const b = $('gm-start');
    if (TEST) { window.__gm.ready = true; return; }
    b.style.display = 'inline-block';
    b.onclick = async () => {
      b.style.display = 'none';
      overlay.style.display = 'none';
      try { await actx.resume(); } catch (e) {}
      W.gm_mouse_move(realMX, realMY);
      W.gm_start();
      running = true;
      requestAnimationFrame(loop);
    };
  }

  async function saveSingle(btn) {
    try {
      btn.disabled = true;
      const parts = [$('gm-head').textContent];
      const meta = Object.assign({}, META);
      delete meta.soundDir;
      parts.push('<script id="gm-meta" type="application/json">' + JSON.stringify(meta) + '<\/script>\n');
      parts.push('<script id="gm-wasm" type="application/octet-stream">' + $('gm-wasm').textContent.trim() + '<\/script>\n');
      parts.push('<script id="gm-data" type="application/octet-stream">' + $('gm-data').textContent.trim() + '<\/script>\n');
      const ids = [];
      for (let i = 0; i < NT; i++) ids.push('gm-tex-' + i);
      for (let i = 0; i < NS; i++) ids.push('gm-snd-' + i);
      for (let k = 0; k < ids.length; k++) {
        btn.textContent = 'BUILDING... ' + Math.round((k / ids.length) * 100) + '%';
        parts.push('<script id="' + ids[k] + '" type="application/octet-stream">' + (await b64Of(ids[k])) + '<\/script>\n');
      }
      parts.push('<script id="gm-runtime">\n' + $('gm-runtime').textContent + '\n<\/script>\n</body></html>\n');
      const url = URL.createObjectURL(new Blob(parts, { type: 'text/html' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = (document.title || 'game') + '.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      btn.textContent = 'SAVED (check your downloads)';
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) {
      btn.textContent = 'COULD NOT BUILD: ' + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  // test hooks (used by the automated browser tests)
  window.__gm = {
    ready: false,
    errors,
    start() { overlay.style.display = 'none'; actx.resume(); W.gm_mouse_move(realMX, realMY); W.gm_start(); },
    async steps(n) { for (let k = 0; k < n; k++) { const r = stepOnce(); if (r === 1) await Promise.all(Array.from(loading.values())); } render(); await Promise.all(Array.from(loading.values())); render(); },
    room() { return W.gm_room(); },
    goto(r) { W.gm_debug_goto(r); },
    mouse(x, y) { realMX = x; realMY = y; mouseOffX = mouseOffY = 0; virtMX = x; virtMY = y; W.gm_mouse_move(x, y); },
    button(b, d) { W.gm_mouse_button(b, d); },
    key(k, d) { W.gm_key(k, d); },
    char(c) { W.gm_char(c); },
    pagesLoaded() { return pages.filter(Boolean).length; },
    frames() { return frameNo; },
    audioInsts() { return Array.from(insts.values()).map((i) => [i.snd, assets[i.snd].meta.name, i.loop, i.playing]); },
  };
  boot().catch((e) => { console.error(e); setStatus('Failed to start: ' + e.message); });
})();

</script>
</body></html>
